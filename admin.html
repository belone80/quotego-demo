<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#040807">
<title>QuoteGo AI Studio — Business Automation OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="ambient"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<div class="grain"></div>

<aside class="sidebar" id="sidebar"></aside>
<div class="nav-backdrop" id="navBackdrop"></div>

<main class="shell">
  <header class="topbar">
    <i class="route-progress" id="routeProgress"></i>
    <button class="icon-btn hamburger" id="hamburger" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="topbar-title">
      <h1 id="pageTitle">Vue d'ensemble</h1>
      <p id="pageSub">Command Center</p>
    </div>
    <div class="topbar-actions">
      <button class="search-pill" id="paletteBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3"/></svg>
        <span>Search / Ask QuoteGo</span>
        <kbd>⌘ K</kbd>
      </button>
      <button class="icon-btn" id="notifBtn" aria-label="Notifications">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 10-12 0c0 6-2 7-2 7h16s-2-1-2-7M10.5 20a2 2 0 003 0"/></svg>
        <span class="notif-badge" id="notifBadge">0</span>
      </button>
      <button class="btn btn-ai" id="panelBtn">
        <span class="ai-spark">✦</span> QuoteGo AI
      </button>
      <div class="head-avatar" id="headBiz">QG</div>
    </div>
  </header>

  <div class="view" id="view"></div>
</main>

<nav class="mobile-nav" id="mobileNav"></nav>

<aside class="ai-panel" id="aiPanel">
  <div class="ai-panel-head">
    <div class="ai-panel-id">
      <span class="ai-panel-logo">✦</span>
      <div><strong>QuoteGo AI</strong><small>Automation Architect</small></div>
    </div>
    <div class="ai-panel-right">
      <span class="status-pill ok"><i></i>Online</span>
      <button class="icon-btn" id="panelClose" aria-label="Fermer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="ai-panel-body" id="panelChat"></div>
</aside>

<button class="ai-fab" id="aiFab"><span>✦</span> Ask QuoteGo</button>

<div class="notif-menu" id="notifMenu">
  <div class="menu-head"><span class="eyebrow">NOTIFICATIONS</span></div>
  <div id="notifList"></div>
</div>

<div class="notif-menu biz" id="bizMenu"></div>

<div class="palette" id="palette">
  <div class="pal-backdrop"></div>
  <div class="pal-card">
    <div class="pal-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3"/></svg>
      <input id="paletteInput" placeholder="Go to Clients, Create Booking, Open AI Studio…" autocomplete="off">
      <kbd>ESC</kbd>
    </div>
    <div class="pal-list" id="paletteList"></div>
    <div class="pal-foot"><span>↑ ↓ naviguer</span><span>↵ ouvrir</span><span>⌘ K palette</span></div>
  </div>
</div>

<div class="onboarding" id="onboarding"></div>

<div class="qg-toast" id="qg-toast"></div>

<script src="config.js"></script>
<script src="admin/data.js"></script>
<script src="admin/ui.js"></script>
<script src="admin/templates.js"></script>
<script src="admin/ai-studio.js"></script>
<script src="admin/automations.js"></script>
<script src="admin/bookings.js"></script>
<script src="admin/clients.js"></script>
<script src="admin/services.js"></script>
<script src="admin/forms.js"></script>
<script src="admin/analytics.js"></script>
<script src="admin/system.js"></script>
<script src="admin/requests.js"></script>
<script src="admin/dashboard.js"></script>
<script src="admin.js"></script>
</body>
</html>
